name: quotation
description: "Quotation app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  home_widget: ^0.10.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.6
  # 6.x uses classic Google Sign-In (clearer Android errors than Credential Manager in 7.x).
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/background/clean/clean_background.png
    - assets/images/background/clean/clean_background2.png
    - assets/images/background/clean/clean_background3.png
    - assets/images/background/clean/clean_background4.png
    - assets/images/background/pixel/sky.png
    - assets/images/background/pixel/noeul.png
    - assets/quotes/ko/
    - assets/quotes/en/

  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: Galmuri
      fonts:
        - asset: assets/fonts/Galmuri11.ttf
