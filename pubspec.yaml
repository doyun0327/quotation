name: quotation
description: "Quotation app"
publish_to: 'none'
version: 1.0.5+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  home_widget: ^0.10.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.6
  # 6.x uses classic Google Sign-In (clearer Android errors than Credential Manager in 7.x).
  google_sign_in: ^6.2.2
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_messaging: ^17.0.0
  app_links: ^7.2.2
  google_mobile_ads: ^9.2.0
  purchases_flutter: ^10.17.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Avoid shared_preferences_android 2.5.0 release crash (R8/JNI NoSuchMethodError → white screen).
dependency_overrides:
  shared_preferences_android: 2.4.21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/background/clean/default_background.png
    - assets/images/background/clean/clean_background.png
    - assets/images/background/clean/clean_background2.png
    - assets/images/background/clean/clean_background3.png
    - assets/images/background/clean/clean_background4.png
    - assets/images/background/pixel/sky.png
    - assets/images/background/pixel/noeul.png
    - assets/images/character/
    - assets/images/like/
    - assets/images/widgetbackground/
    - assets/quotes/ko/
    - assets/quotes/en/
    - assets/quotes/jp/

  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: Galmuri
      fonts:
        - asset: assets/fonts/Galmuri11.ttf
