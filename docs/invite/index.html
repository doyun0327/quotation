<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dearly 초대</title>
  <meta property="og:title" content="Dearly 초대" />
  <meta property="og:site_name" content="Dearly 초대" />
  <meta name="application-name" content="Dearly" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f7fd;
      color: #2c3340;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      background: #fff;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,.06);
      text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #8a93a3; font-size: .95rem; line-height: 1.45; }
    code {
      display: inline-block;
      margin: 12px 0;
      padding: 10px 16px;
      font-size: 1.4rem;
      letter-spacing: .2em;
      font-weight: 800;
      color: #5b8def;
      background: #f3f7fd;
      border-radius: 12px;
    }
    a.btn {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      border-radius: 999px;
      background: #5b8def;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    a.btn.sub {
      background: #fff;
      color: #5b8def;
      border: 1.5px solid #5b8def;
      padding: 10px 18px;
    }
    .hidden { display: none !important; }
    .note { font-size: .82rem; margin-top: 14px; }
  </style>
  <script>
    (function () {
      // App Store numeric id (App Store Connect > 앱 정보 > Apple ID).
      // Leave empty until the app is live; the App Store button stays hidden.
      var APP_STORE_ID = '6827842803';
      var ANDROID_PACKAGE = 'com.dearly.quoteswidget';
      var PLAY_URL = 'https://play.google.com/store/apps/details?id=' + ANDROID_PACKAGE;

      var parts = location.pathname.split('/').filter(Boolean);
      var code = '';
      if (parts[0] === 'invite' && parts[1]) code = parts[1].toUpperCase();
      window.__INVITE_CODE__ = code;
      // Play hands this to the app after install (install referrer), so the
      // invite opens on first launch without typing the code.
      if (code) {
        PLAY_URL += '&referrer=' + encodeURIComponent('invite_code=' + code);
      }
      var APP_STORE_URL = 'https://apps.apple.com/app/id' + APP_STORE_ID;

      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      // KakaoTalk's in-app browser blocks custom app schemes.
      var isKakao = /KAKAOTALK/i.test(ua);

      function appUrl() {
        var c = encodeURIComponent(code);
        if (isAndroid) {
          // Opens the app, or the Play Store when it is not installed.
          return 'intent://invite/' + c + '#Intent;scheme=dearly;package=' +
            ANDROID_PACKAGE + ';S.browser_fallback_url=' +
            encodeURIComponent(PLAY_URL) + ';end';
        }
        return 'dearly://invite/' + c;
      }

      // Runs [then] after [ms] unless this page went to the background
      // (another app or browser took over).
      function unlessLeft(ms, then) {
        var timer = setTimeout(function () {
          if (!document.hidden) then();
        }, ms);
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) clearTimeout(timer);
        });
        window.addEventListener('pagehide', function () { clearTimeout(timer); });
      }

      function goToStore() {
        if (isAndroid) {
          location.href = PLAY_URL;
        } else if (isIOS && APP_STORE_ID) {
          location.href = APP_STORE_URL;
        }
      }

      // iPhone: the App Store cannot carry the code, so it goes on the
      // clipboard and the app reads it on first launch. Safari only allows
      // this inside a tap.
      function copyForInstall() {
        if (!isIOS || !code) return;
        writeClipboard('Dearly 초대 코드 ' + code);
      }

      // iPhone without the app: no automatic App Store jump (that would lose
      // the code); one tap on the highlighted button copies it and goes.
      function promptStoreIOS() {
        var store = document.getElementById('store');
        var note = document.getElementById('install-note');
        if (store) store.className = 'btn';
        if (note) note.classList.remove('hidden');
      }

      function openApp(fromTap) {
        if (!code) return;
        if (fromTap) copyForInstall();
        if (isKakao) {
          // Reopen this page in the phone's default browser, which can
          // hand the link to the app (or send to the store).
          location.href = 'kakaotalk://web/openExternal?url=' +
            encodeURIComponent(location.href);
          // Older KakaoTalk ignores openExternal. Android's in-app browser
          // still understands intent:// (app or Play Store); on iPhone the
          // app scheme is blocked, so go straight to the App Store.
          unlessLeft(1500, function () {
            if (isAndroid) location.href = appUrl();
            else goToStore();
          });
          return;
        }
        location.href = appUrl();
        if (isIOS) {
          // iOS has no store fallback for app schemes. If the app opened,
          // this page goes to the background; otherwise a tap goes to the
          // App Store (the tap already copied the code), or the store button
          // is offered when this ran on its own.
          unlessLeft(1800, fromTap ? goToStore : promptStoreIOS);
        }
      }

      function writeClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(function () {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      }

      function copyCode(btn) {
        if (!code) return;
        var done = function () {
          btn.textContent = '복사했어요!';
          setTimeout(function () { btn.textContent = '코드 복사'; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(done, function () {
            fallbackCopy(code); done();
          });
        } else {
          fallbackCopy(code); done();
        }
      }

      function fallbackCopy(text) {
        var input = document.createElement('textarea');
        input.value = text;
        input.setAttribute('readonly', '');
        input.style.position = 'absolute';
        input.style.left = '-9999px';
        document.body.appendChild(input);
        input.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(input);
      }

      window.addEventListener('DOMContentLoaded', function () {
        var el = document.getElementById('code');
        if (el) el.textContent = code || '———';

        var open = document.getElementById('open');
        open.addEventListener('click', function (e) { e.preventDefault(); openApp(true); });

        var copy = document.getElementById('copy');
        copy.addEventListener('click', function (e) { e.preventDefault(); copyCode(copy); });
        if (!code) copy.classList.add('hidden');

        var store = document.getElementById('store');
        if (isAndroid) {
          store.href = PLAY_URL;
          store.textContent = 'Play 스토어에서 받기';
        } else if (isIOS && APP_STORE_ID) {
          store.href = APP_STORE_URL;
          store.textContent = 'App Store에서 받기';
          store.addEventListener('click', function (e) {
            e.preventDefault();
            copyForInstall();
            location.href = APP_STORE_URL;
          });
        } else {
          store.classList.add('hidden');
        }

        if (code) setTimeout(function () { openApp(false); }, 400);
      });
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1>Dearly 초대</h1>
    <p>우리 같이 위젯 꾸밀래? 💙</p>
    <p>앱이 설치되어 있으면 바로 열려요. 코드는 앱의 「초대 코드로 참여」에도 입력할 수 있어요.</p>
    <code id="code">———</code>
    <div><a class="btn" id="open" href="#">앱에서 열기</a></div>
    <div><a class="btn sub" id="copy" href="#">코드 복사</a></div>
    <div><a class="btn sub" id="store" href="#">앱 받기</a></div>
    <p class="note hidden" id="install-note">앱이 없네요! 위 버튼으로 설치하면 처음 열 때 초대가 바로 이어져요.</p>
    <p class="note">앱이 없다면 먼저 설치한 뒤, 앱의 「초대 코드로 참여」에 위 코드를 입력해 주세요.</p>
  </div>
</body>
</html>
