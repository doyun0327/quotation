<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dearly · 디데이 초대</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f7fd;
      color: #2c3340;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      background: #fff;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,.06);
      text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #8a93a3; font-size: .95rem; line-height: 1.45; }
    code {
      display: inline-block;
      margin: 12px 0;
      padding: 10px 16px;
      font-size: 1.4rem;
      letter-spacing: .2em;
      font-weight: 800;
      color: #5b8def;
      background: #f3f7fd;
      border-radius: 12px;
    }
    a.btn {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      border-radius: 999px;
      background: #5b8def;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var code = '';
      if (parts[0] === 'invite' && parts[1]) code = parts[1].toUpperCase();
      window.__INVITE_CODE__ = code;
      function openApp() {
        if (!code) return;
        location.href = 'dearly://invite/' + encodeURIComponent(code);
      }
      window.addEventListener('DOMContentLoaded', function () {
        var el = document.getElementById('code');
        if (el) el.textContent = code || '———';
        var btn = document.getElementById('open');
        if (btn) btn.addEventListener('click', openApp);
        if (code) setTimeout(openApp, 400);
      });
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1>디데이 친구 초대</h1>
    <p>앱이 설치되어 있으면 바로 열려요. 코드는 앱의 「초대 코드로 참여」에도 입력할 수 있어요.</p>
    <code id="code">———</code>
    <div><a class="btn" id="open" href="#">앱에서 열기</a></div>
  </div>
</body>
</html>
