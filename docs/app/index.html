<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dearly 다운로드</title>
  <meta name="description" content="Dearly - 매일 마음에 닿는 한 문장과, 친구와 함께 꾸미는 위젯" />
  <meta property="og:title" content="Dearly" />
  <meta property="og:description" content="매일 마음에 닿는 한 문장과, 친구와 함께 꾸미는 위젯" />
  <meta property="og:image" content="https://dearly-cf730.web.app/app/girl3.png" />
  <meta property="og:site_name" content="Dearly" />
  <meta name="theme-color" content="#f3f7fd" />
  <link rel="icon" href="girl3.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2/dist/galmuri.css" />
  <style>
    :root {
      --bg: #f3f7fd;
      --card: #ffffff;
      --ink: #2c3340;
      --muted: #7b8496;
      --accent: #5b8def;
      --accent-soft: #e6eefc;
      --dash: #a9c2f2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Galmuri11', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px calc(28px + env(safe-area-inset-bottom));
    }
    main {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .brand {
      font-family: 'Galmuri11', monospace;
      font-weight: 700;
      font-size: 2.6rem;
      letter-spacing: .02em;
      margin: 0;
      color: var(--ink);
    }
    .sub {
      margin: 6px 0 0;
      font-size: .72rem;
      letter-spacing: .28em;
      color: var(--muted);
    }
    .duo {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 4px;
      margin: 26px 0 8px;
    }
    .duo img {
      width: 46%;
      max-width: 168px;
      aspect-ratio: 1;
      object-fit: contain;
      image-rendering: pixelated;
      background: var(--card);
      border: 2px dashed var(--dash);
      border-radius: 28px;
      padding: 6px;
    }
    .duo img:first-child { transform: rotate(-4deg); }
    .duo img:last-child { transform: rotate(4deg); }
    .bubble {
      display: inline-block;
      margin: 14px 0 0;
      padding: 9px 16px;
      border: 2px solid var(--accent);
      border-radius: 999px;
      background: var(--card);
      color: var(--accent);
      font-size: .9rem;
    }
    .desc {
      margin: 18px 4px 26px;
      font-size: .95rem;
      line-height: 1.7;
      color: var(--ink);
    }
    .stores {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .store {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 56px;
      padding: 12px 20px;
      border-radius: 18px;
      text-decoration: none;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 1.02rem;
      background: var(--card);
      color: var(--ink);
      border: 2px solid var(--dash);
      transition: transform .12s ease;
    }
    .store:active { transform: scale(.98); }
    .store.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .store:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    .store svg { width: 22px; height: 22px; flex: none; }
    .foot {
      margin-top: 26px;
      font-size: .72rem;
      color: var(--muted);
    }
    .foot a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">Dearly</h1>
    <p class="sub">FOR A KINDER YOU</p>

    <div class="duo">
      <img src="girl2.png" alt="곰돌이 귀 머리띠를 한 Dearly 캐릭터" width="168" height="168" />
      <img src="girl3.png" alt="노란 우비를 입은 Dearly 캐릭터" width="168" height="168" />
    </div>
    <span class="bubble">우리 같이 위젯 꾸밀래?</span>

    <p class="desc">
      매일 마음에 닿는 한 문장과,<br />
      친구와 함께 꾸미는 홈 화면 위젯
    </p>

    <div class="stores">
      <a class="store" id="ios" href="https://apps.apple.com/app/id6827842803">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.87-.76-1.47.02-2.83.86-3.59 2.18-1.53 2.66-.39 6.6 1.1 8.75.73 1.05 1.6 2.24 2.73 2.2 1.1-.05 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.4 1.2-2.46-.03-.01-2.3-.88-2.32-3.5zM14.2 6.13c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.65-1.05 1.68-.92 2.67.97.08 1.96-.49 2.56-1.22z"/></svg>
        App Store에서 받기
      </a>
      <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.dearly.quoteswidget">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.3c-.2.2-.3.6-.3 1v17.4c0 .4.1.8.3 1l9.7-9.7L3.6 2.3zm10.8 10.8 2.6 2.6-11.5 6.6c-.3.2-.7.2-1 .1l9.9-9.3zm0-2.2L4.5 1.6c.3-.1.7 0 1 .2l11.5 6.5-2.6 2.6zm3.6-1.9 3 1.7c.8.5.8 1.6 0 2.1l-3 1.7-2.9-2.8 2.9-2.7z"/></svg>
        Google Play에서 받기
      </a>
    </div>

  </main>
  <script>
    // The button for the visitor's phone goes first and is filled in.
    (function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var ios = document.getElementById('ios');
      var android = document.getElementById('android');
      if (isAndroid) {
        android.classList.add('primary');
        android.parentNode.insertBefore(android, ios);
      } else {
        ios.classList.add('primary');
      }
    })();
  </script>
</body>
</html>
